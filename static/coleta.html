<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coleta de preços - Bizoiando</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-light">
    <header class="bg-success text-white py-4 text-center">
      <div class="container">
        <h1 class="h3 mb-1">Coleta de preços</h1>
        <p class="mb-2">Registre os preços encontrados nos mercados</p>
        <a href="/" class="btn btn-outline-light btn-sm">Voltar à busca</a>
      </div>
    </header>

    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
              <h2 class="h5 mb-0">Cadastrar um preço</h2>
            </div>
            <div class="card-body">
              <form id="form-preco">
                <div class="mb-3">
                  <label for="produto" class="form-label">Produto</label>
                  <select
                    id="produto"
                    class="form-select form-select-lg"
                    required
                  ></select>
                </div>
                <div class="mb-3">
                  <label for="mercado" class="form-label">Mercado</label>
                  <select
                    id="mercado"
                    class="form-select form-select-lg"
                    required
                  ></select>
                </div>
                <div class="row">
                  <div class="col-6 mb-3">
                    <label for="valor" class="form-label">Valor (R$)</label>
                    <input
                      type="number"
                      id="valor"
                      class="form-control form-control-lg"
                      step="0.01"
                      min="0.01"
                      required
                    />
                  </div>
                  <div class="col-6 mb-3">
                    <label for="data" class="form-label">Data da coleta</label>
                    <input
                      type="date"
                      id="data"
                      class="form-control form-control-lg"
                      required
                    />
                  </div>
                </div>
                <button class="btn btn-success btn-lg w-100" type="submit">
                  Salvar preço
                </button>
              </form>
              <div id="aviso-preco" class="mt-3" aria-live="polite"></div>
            </div>
          </div>

          <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
              <h2 class="h5 mb-0">Importar planilha CSV</h2>
            </div>
            <div class="card-body">
              <p class="text-muted small mb-3">
                Colunas obrigatórias:
                <code>produto;mercado;valor;data_coleta</code>. A data pode ser
                <code>2026-11-16</code> ou <code>16/11/2026</code>, e o valor
                pode ter vírgula.
              </p>
              <form id="form-csv">
                <input
                  type="file"
                  id="arquivo"
                  class="form-control mb-3"
                  accept=".csv"
                  required
                />
                <button class="btn btn-outline-success w-100" type="submit">
                  Importar
                </button>
              </form>
              <div id="aviso-csv" class="mt-3" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/static/coleta.js"></script>
  </body>
</html>
