<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bizoiando - Onde Comprar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-light">
    <header class="bg-success text-white py-4 text-center">
      <div class="container">
        <h1 class="h3 mb-1">Bizoiando</h1>
        <p class="mb-0">Seu comparador de Preços definitivo</p>
      </div>
    </header>

    <main class="container py-4">
      <form
        id="form-busca"
        class="row justify-content-center mb-4"
        role="search"
      >
        <div class="col-12 col-md-8 col-lg-6">
          <div class="input-group input-group-lg">
            <input
              type="search"
              id="campo-busca"
              class="form-control"
              placeholder="Ex.: tomate, leite, ovos"
              aria-label="Nome do perecível"
              autocomplete="off"
              required
            />
            <button class="btn btn-success" type="submit">Buscar</button>
          </div>
        </div>
      </form>

      <!-- Os resultados são inseridos aqui pelo script.js -->
      <div id="resultado" class="row justify-content-center" aria-live="polite">
        <div class="col-12 col-md-8 col-lg-6 text-center text-muted">
          Digite o nome de um perecível para comparar os preços.
        </div>
      </div>
    </main>

    <script src="/static/script.js"></script>
  </body>
</html>
